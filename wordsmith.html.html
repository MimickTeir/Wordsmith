<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordSmith — Writing Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f4ef; --page:#fdfcfa; --surface:#f2efe9; --surface-2:#ebe7e0;
  --ink:#1c1a17; --ink-2:#4a4540; --ink-3:#9a938c; --ink-4:#c8c3bc;
  --sage:#4a7c59; --sage-l:#eaf2ec; --sage-m:#b8d4c0;
  --rose:#c0392b; --rose-l:#fdf0ee;
  --amber:#b8860b; --amber-l:#fdf8e8;
  --blue:#2563eb; --blue-l:#eff6ff;
  --border:#ddd8d2; --border-s:#ccc7c0;
  --sh-sm:0 1px 4px rgba(28,26,23,.07);
  --sh-md:0 4px 16px rgba(28,26,23,.10);
  --sh-lg:0 12px 40px rgba(28,26,23,.14);
  --r:10px; --fs:19px; --lh:1.85;
  --mono:'IBM Plex Mono',monospace;
  --sans:'DM Sans',sans-serif;
  --serif:'DM Serif Display',serif;
  --body:'Atkinson Hyperlegible',sans-serif;
  --tr:180ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;}
.shell{display:flex;flex-direction:column;height:100vh;}

/* HEADER */
.hdr{height:52px;flex-shrink:0;background:var(--page);border-bottom:1.5px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;box-shadow:var(--sh-sm);}
.logo{font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:-.3px;flex-shrink:0;}
.logo-dot{color:var(--sage);}
.hdiv{width:1.5px;height:18px;background:var(--border);flex-shrink:0;}
.hright{margin-left:auto;display:flex;gap:6px;align-items:center;}
.hpill{padding:4px 11px;border:1.5px solid var(--border-s);border-radius:20px;font-size:12px;color:var(--ink-2);background:var(--surface);cursor:pointer;font-family:var(--sans);font-weight:500;transition:all var(--tr);white-space:nowrap;display:flex;align-items:center;gap:5px;}
.hpill:hover{border-color:var(--ink-2);}
.hpill.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.hpill.sage{background:var(--sage-l);color:var(--sage);border-color:var(--sage-m);}
.hpill.rose{background:var(--rose-l);color:var(--rose);border-color:#f0bbb5;}

/* TOOLBAR */
.toolbar{height:44px;flex-shrink:0;background:var(--surface);border-bottom:1.5px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:4px;overflow-x:auto;scrollbar-width:none;}
.toolbar::-webkit-scrollbar{display:none;}
.tbar-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border:1.5px solid transparent;border-radius:7px;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-2);background:transparent;cursor:pointer;transition:all var(--tr);white-space:nowrap;}
.tbar-btn:hover{background:var(--surface-2);border-color:var(--border-s);}
.tbar-btn.active{background:var(--page);border-color:var(--border-s);color:var(--ink);box-shadow:var(--sh-sm);}
.tbar-btn.sage{color:var(--sage);}
.tbar-btn.rose{color:var(--rose);}
.tbar-sep{width:1.5px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0;}

/* PROCESSING BAR */
.pbar{position:fixed;top:52px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--sage),var(--sage-m),var(--sage));background-size:200% 100%;animation:shimmer 1.2s infinite;z-index:200;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden;position:relative;}

/* WRITING PANEL */
.write-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.doc-wrap{flex:1;overflow-y:auto;padding:32px 24px 140px;}
.doc-page{max-width:720px;margin:0 auto;background:var(--page);border-radius:4px;box-shadow:var(--sh-sm);min-height:calc(100vh - 200px);border:1px solid var(--border);}
.doc-ta{width:100%;border:none;outline:none;background:transparent;resize:none;font-family:var(--body);font-size:var(--fs);line-height:var(--lh);color:var(--ink);padding:44px 52px;letter-spacing:.01em;min-height:calc(100vh - 220px);caret-color:var(--sage);}
.doc-ta::placeholder{color:var(--ink-4);font-style:italic;}

/* POLISHED */
.pol-wrap{border-top:2px solid var(--sage-m);background:var(--sage-l);padding:28px 52px 32px;border-radius:0 0 4px 4px;}
.pol-label{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--sage);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.pol-text{font-family:var(--body);font-size:var(--fs);line-height:var(--lh);color:var(--ink);letter-spacing:.01em;white-space:pre-wrap;margin-bottom:14px;}
.pol-actions{display:flex;gap:7px;flex-wrap:wrap;}
.pbtn{padding:6px 15px;border-radius:20px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all var(--tr);border:1.5px solid;}
.pbtn-primary{background:var(--sage);color:#fff;border-color:var(--sage);}
.pbtn-primary:hover{background:#3a6347;}
.pbtn-outline{background:#fff;color:var(--sage);border-color:var(--sage-m);}
.pbtn-outline:hover{background:var(--sage);color:#fff;border-color:var(--sage);}
.pbtn-amber{background:var(--amber-l);color:var(--amber);border-color:#c8a84b;}
.pbtn-amber:hover{background:var(--amber);color:#fff;}
.pbtn-ghost{background:transparent;color:var(--ink-3);border-color:var(--border);}
.pbtn-ghost:hover{border-color:var(--ink-2);color:var(--ink-2);}
.del{color:var(--rose);text-decoration:line-through;background:var(--rose-l);padding:0 2px;border-radius:2px;}
.ins{color:var(--sage);background:rgba(74,124,89,.1);padding:0 2px;border-radius:2px;}

/* MIC */
.mic-zone{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;}
.mic-btn{width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;transition:all var(--tr);box-shadow:var(--sh-md);}
.mic-btn.idle{background:var(--ink);color:#fff;}
.mic-btn.idle:hover{background:var(--ink-2);box-shadow:var(--sh-lg);transform:scale(1.05);}
.mic-btn.on{background:var(--rose);color:#fff;animation:micPulse 1.5s infinite;}
.mic-btn.reading{background:var(--blue);color:#fff;animation:micPulse2 2s infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.4),var(--sh-md)}50%{box-shadow:0 0 0 12px rgba(192,57,43,0),var(--sh-md)}}
@keyframes micPulse2{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4),var(--sh-md)}50%{box-shadow:0 0 0 12px rgba(37,99,235,0),var(--sh-md)}}
.mic-status{background:rgba(28,26,23,.8);color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;font-family:var(--mono);white-space:nowrap;backdrop-filter:blur(4px);}
.audio-meter{display:flex;gap:2px;align-items:flex-end;height:22px;}
.mbar{width:3px;border-radius:2px;transition:height 80ms ease;}
.interim-chip{background:rgba(28,26,23,.75);color:rgba(255,255,255,.85);border-radius:16px;padding:4px 14px;font-size:13px;font-family:var(--body);font-style:italic;backdrop-filter:blur(4px);max-width:420px;text-align:center;}

/* VAULT SIDEBAR */
.vsb{width:300px;flex-shrink:0;background:var(--surface);border-left:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.vsb-hdr{padding:9px 10px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.vsb-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);}
.vsb-new{padding:3px 9px;background:var(--ink);color:#fff;border:none;border-radius:5px;font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;}
.vsb-list{flex:1;overflow-y:auto;padding:5px;}
.vsb-row{display:flex;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background var(--tr);gap:5px;border:1.5px solid transparent;}
.vsb-row:hover{background:var(--page);border-color:var(--border);}
.vsb-row-t{flex:1;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vsb-ie{display:flex;gap:4px;padding:5px 6px;border-top:1.5px solid var(--border);background:var(--page);flex-shrink:0;}
.ie-btn{padding:3px 9px;border:1.5px solid var(--border-s);border-radius:5px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--ink-3);transition:all var(--tr);}
.ie-btn:hover{border-color:var(--ink-2);color:var(--ink-2);}
.scratch-wrap{flex-shrink:0;border-top:1.5px solid var(--border);height:140px;display:flex;flex-direction:column;}
.scratch-hdr{padding:6px 10px;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.scratch-t{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
.scratch-area{flex:1;width:100%;background:transparent;border:none;outline:none;resize:none;padding:7px 10px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.7;}
.scratch-area::placeholder{color:var(--ink-4);}
.pr-btn{background:none;border:1.5px solid transparent;border-radius:4px;cursor:pointer;padding:2px 5px;font-size:12px;color:var(--ink-3);transition:all var(--tr);opacity:0;}
.vsb-row:hover .pr-btn{opacity:1;}
.pr-btn:hover{border-color:var(--border-s);color:var(--ink-2);background:var(--surface-2);}
.pr-btn.del:hover{border-color:var(--rose);color:var(--rose);background:var(--rose-l);}

/* SETTINGS DRAWER */
.settings-overlay{position:fixed;inset:0;background:rgba(28,26,23,.4);backdrop-filter:blur(2px);z-index:300;display:flex;justify-content:flex-end;}
.settings-drawer{width:600px;max-width:95vw;background:var(--page);border-left:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-lg);animation:drawerIn .2s ease both;}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.sd-hdr{padding:13px 18px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface);}
.sd-title{font-family:var(--serif);font-size:18px;color:var(--ink);}
.sd-profile-badge{font-size:11px;color:var(--ink-3);background:var(--page);border:1.5px solid var(--border-s);border-radius:20px;padding:3px 10px;font-family:var(--mono);}
.sd-close{margin-left:auto;background:none;border:none;cursor:pointer;font-size:18px;color:var(--ink-3);line-height:1;padding:4px 8px;border-radius:6px;transition:all var(--tr);}
.sd-close:hover{background:var(--surface-2);color:var(--ink);}
.sd-inner{display:flex;flex:1;overflow:hidden;}
.sd-nav{width:150px;flex-shrink:0;border-right:1.5px solid var(--border);background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.sd-nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:all var(--tr);border:1.5px solid transparent;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-2);background:none;text-align:left;width:100%;}
.sd-nav-item:hover{background:var(--surface-2);}
.sd-nav-item.active{background:var(--page);border-color:var(--border-s);color:var(--ink);box-shadow:var(--sh-sm);}
.sd-nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.sd-nav-label{font-size:12px;}
.sd-body{flex:1;overflow-y:auto;padding:20px;}

/* Settings components */
.s-section{margin-bottom:20px;}
.s-label{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:block;}
.s-sublabel{font-size:12px;color:var(--ink-3);margin-bottom:8px;line-height:1.5;}
.s-input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);outline:none;transition:border var(--tr);}
.s-input:focus{border-color:var(--ink-2);}
.s-input::placeholder{color:var(--ink-4);}
.s-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.s-btn{padding:5px 13px;border:1.5px solid var(--border-s);border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--ink-2);transition:all var(--tr);}
.s-btn:hover{border-color:var(--ink-2);}
.s-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.s-btn.danger{color:var(--rose);border-color:var(--border);}
.s-btn.danger:hover{background:var(--rose-l);border-color:var(--rose);}
.s-btn:disabled{opacity:.4;cursor:not-allowed;}
.chip-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.chip{display:flex;align-items:center;gap:4px;padding:3px 10px 3px 12px;border:1.5px solid var(--border-s);border-radius:20px;background:#fff;font-size:12px;}
.chip-x{background:none;border:none;cursor:pointer;color:var(--ink-4);font-size:13px;line-height:1;padding:0 0 0 2px;}
.chip-x:hover{color:var(--rose);}
.select{padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);outline:none;cursor:pointer;}
.select:focus{border-color:var(--ink-2);}
.divider{border:none;border-top:1.5px solid var(--border);margin:16px 0;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.toggle-label{font-size:13px;color:var(--ink-2);}
.toggle-sub{font-size:11px;color:var(--ink-3);margin-top:2px;}
.toggle{width:36px;height:20px;border-radius:20px;border:none;cursor:pointer;position:relative;transition:background var(--tr);flex-shrink:0;}
.toggle.on{background:var(--sage);}
.toggle.off{background:var(--border-s);}
.toggle::after{content:'';position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left var(--tr);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.toggle.on::after{left:18px;}
.toggle.off::after{left:2px;}

/* Profile card */
.profile-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;background:#fff;margin-bottom:5px;cursor:pointer;transition:all var(--tr);}
.profile-card:hover{border-color:var(--border-s);}
.profile-card.active{border-color:var(--sage);background:var(--sage-l);}
.profile-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.profile-name{font-size:14px;font-weight:600;color:var(--ink);}
.profile-mic{font-size:11px;color:var(--ink-3);font-family:var(--mono);}

/* Training */
.training-passage{background:var(--surface);border:1.5px solid var(--border);border-radius:7px;padding:14px 16px;font-family:var(--body);font-size:15px;line-height:1.8;color:var(--ink-2);margin-bottom:10px;max-height:140px;overflow-y:auto;}
.training-result{background:var(--sage-l);border:1.5px solid var(--sage-m);border-radius:7px;padding:12px 14px;font-size:13px;line-height:1.6;margin-top:10px;}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(28,26,23,.5);backdrop-filter:blur(3px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--page);border:1.5px solid var(--border-s);border-radius:12px;width:100%;max-width:460px;box-shadow:var(--sh-lg);animation:modalIn .2s ease both;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1.5px solid var(--border);}
.modal-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);}
.modal-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.modal-foot{display:flex;justify-content:flex-end;gap:7px;padding:11px 16px;border-top:1.5px solid var(--border);}
.field label{display:block;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;}
.field input,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:6px;padding:7px 9px;font-family:var(--sans);font-size:13px;color:var(--ink);outline:none;transition:border var(--tr);resize:vertical;}
.field input:focus,.field textarea:focus{border-color:var(--ink-2);}
.field textarea{min-height:110px;line-height:1.6;font-family:var(--mono);font-size:12px;}

/* Toast */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 18px;border-radius:20px;font-size:12px;font-weight:500;box-shadow:var(--sh-md);z-index:999;animation:toastIn .2s ease both;pointer-events:none;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

    <>
      <div className="twk-sect">{label}</div>
      {children}

}

function TweakRow({ label, value, children, inline = false }) {

    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}

/* ── NUMBER UTILS ── */
const NUM_WORDS = {
  zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
  ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,
  seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,
  sixty:60,seventy:70,eighty:80,ninety:90,hundred:100,thousand:1000,million:1000000,
};
const DIGIT_TO_WORD = ['zero','one','two','three','four','five','six','seven','eight','nine',
  'ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen',
  'nineteen','twenty'];
const TENS_WORD = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function numToWord(n) {
  if(n===0) return 'zero';
  if(n<=20) return DIGIT_TO_WORD[n];
  if(n<100) return TENS_WORD[Math.floor(n/10)] + (n%10?'-'+DIGIT_TO_WORD[n%10]:'');
  if(n<1000) return DIGIT_TO_WORD[Math.floor(n/100)]+'hundred'+(n%100?' '+numToWord(n%100):'');
  return n.toString();
}

function applyNumberFormat(text, fmt, rangeMax=100) {
  if(fmt==='none') return text;
  // words→digits
  if(fmt==='digits' || fmt==='auto' || fmt==='range') {
    text = text.replace(/\b(twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)[- ](one|two|three|four|five|six|seven|eight|nine)\b/gi, m=>{
      const parts = m.toLowerCase().replace(/-/,' ').split(' ');
      const v = (NUM_WORDS[parts[0]]||0)+(NUM_WORDS[parts[1]]||0);
      if(fmt==='range' && v<=rangeMax) return numToWord(v);
      return v.toString();
    });
    text = text.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|million)\b/gi, m=>{
      const v = NUM_WORDS[m.toLowerCase()];
      if(v === undefined) return m;
      if(fmt==='range' && v<=rangeMax) return numToWord(v); // keep as word
      if(fmt==='range') return v.toString();
      if(fmt==='digits') return v.toString();
      return m; // auto = keep as spoken
    });
  }
  return text;
}

/* ── PUNCT COMMANDS ── */
const BUILT_IN_PUNCT = {
  'period':'.','full stop':'.','comma':',','question mark':'?',
  'exclamation mark':'!','exclamation point':'!','colon':':','semicolon':';',
  'new line':'\n','new paragraph':'\n\n','open bracket':'(',
  'close bracket':')','dash':'—','ellipsis':'…','dot dot dot':'…',
  'open quote':'"','close quote':'"',
};

/* ── PROCESS TRANSCRIPT ── */
function processTranscript(raw, profile) {
  let t = raw;
  // Built-in punct
  for(const [cmd,sym] of Object.entries(BUILT_IN_PUNCT))
    t = t.replace(new RegExp(`\\b${cmd}\\b`,'gi'), sym);
  // Vocabulary substitutions
  for(const v of (profile.vocabulary||[])) {
    if(!v.spoken) continue;
    try { t = t.replace(new RegExp(`\\b${v.spoken.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'gi'), v.written); } catch {}
  }
  // Corrections
  for(const c of (profile.corrections||[])) {
    if(!c.from) continue;
    try { t = t.replace(new RegExp(c.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), c.to); } catch {}
  }
  // Number format
  t = applyNumberFormat(t, profile.numberFormat||'auto', profile.numberRangeMax||100);
  // Auto-capitalize
  t = t.replace(/(^|[.!?\n]\s*)([a-z])/g, (_,pre,ch)=>pre+ch.toUpperCase());
  return t.trim();
}

/* ── COMMAND CHECK ── */
function checkCommand(raw, profile) {

  }

}

/* ── DIFF ── */
function computeDiff(a,b) {
  const wa=a.trim().split(/\s+/),wb=b.trim().split(/\s+/);
  const m=wa.length,n=wb.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) {
    dp[i][j]=wa[i-1].toLowerCase().replace(/[^a-z0-9]/g,'')===wb[j-1].toLowerCase().replace(/[^a-z0-9]/g,'')?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  }
  const d=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&wa[i-1].toLowerCase().replace(/[^a-z0-9]/g,'')===wb[j-1].toLowerCase().replace(/[^a-z0-9]/g,''))
      {d.unshift({type:'eq',val:wb[j-1]});i--;j--;}
    else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){d.unshift({type:'ins',val:wb[j-1]});j--;}
    else{d.unshift({type:'del',val:wa[i-1]});i--;}
  }
  const r=[];for(const x of d){if(r.length&&r[r.length-1].type===x.type)r[r.length-1].val+=' '+x.val;else r.push({...x});}
  return r;
}

function DiffView({original,polished}) {

}

  const importVocab=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){upd({vocabulary:[...d.map(x=>({spoken:x.spoken||'',written:x.written||'',id:uid()})),...(profile.vocabulary||[])]});}}catch{} };r.readAsText(f);e.target.value='';};

      </div>{/* settings-drawer */}
    </div>

/* ── VAULT SIDEBAR ── */
function VaultSidebar({onLoad,onSaveRef}) {
  const [prompts,setPrompts]=useState(()=>{try{const r=localStorage.getItem(K.vault);return r?JSON.parse(r):[];}catch{return[];}});
  const [q,setQ]=useState('');
  const [scratch,setScratch]=useState(()=>localStorage.getItem(K.notes)||'');
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({title:'',category:'',body:''});
  const fileRef=useRef();
  const save=p=>{localStorage.setItem(K.vault,JSON.stringify(p));};
  const filtered=prompts.filter(p=>!q||p.title.toLowerCase().includes(q.toLowerCase())||p.body.toLowerCase().includes(q.toLowerCase()));
  useEffect(()=>{onSaveRef.current=(title,body,cat='Polished')=>{const next=[{id:uid(),title,category:cat,body},...prompts];setPrompts(next);save(next);};}, [prompts]);
  const saveP=()=>{if(!form.title.trim()||!form.body.trim())return;const next=modal==='new'?[{id:uid(),...form,category:form.category||'General'},...prompts]:prompts.map(p=>p.id===modal.id?{...p,...form}:p);setPrompts(next);save(next);setModal(null);};
  const del=id=>{if(!confirm('Delete?'))return;const next=prompts.filter(p=>p.id!==id);setPrompts(next);save(next);};
  const exportData=()=>{const b=new Blob([JSON.stringify(prompts,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`vault-${new Date().toISOString().slice(0,10)}.json`;a.click();};
  const handleImport=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){const ex=new Set(prompts.map(p=>p.id));const next=[...d.filter(p=>!ex.has(p.id)).map(p=>({id:p.id||uid(),title:p.title||p.name||'Imported',category:p.category||'Imported',body:p.body||p.text||p.content||''})).filter(p=>p.body),...prompts];setPrompts(next);save(next);}}catch{}};r.readAsText(f);e.target.value='';};
  return (
    <div className="vsb">
      <div className="vsb-hdr">
        <span className="vsb-title">⬡ Vault</span>
        <button className="vsb-new" onClick={()=>{setForm({title:'',category:'',body:''});setModal('new');}}>+ New</button>
      </div>
      <div style={{padding:'6px 7px',borderBottom:'1.5px solid var(--border)'}}>
        <input style={{width:'100%',padding:'5px 9px',border:'1.5px solid var(--border)',borderRadius:6,fontFamily:'var(--sans)',fontSize:13,color:'var(--ink)',background:'var(--page)',outline:'none'}} placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div className="vsb-list">
        {!filtered.length&&<div style={{padding:'24px 10px',textAlign:'center',color:'var(--ink-3)',fontSize:13}}>No prompts yet.</div>}
        {filtered.map(p=>(
          <div key={p.id} className="vsb-row" onClick={()=>onLoad(p.body)}>
            <span className="vsb-row-t">{p.title}</span>
            <button className="pr-btn" onClick={e=>{e.stopPropagation();setForm({title:p.title,category:p.category,body:p.body});setModal(p);}}>✎</button>
            <button className="pr-btn del" onClick={e=>{e.stopPropagation();del(p.id);}}>✕</button>
          </div>
        ))}
      </div>
      <div className="vsb-ie">
        <label className="ie-btn" style={{cursor:'pointer'}}>↑ Import<input type="file" accept=".json" ref={fileRef} style={{display:'none'}} onChange={handleImport}/></label>
        <button className="ie-btn" onClick={exportData}>↓ Export</button>
        <span style={{marginLeft:'auto',fontFamily:'var(--mono)',fontSize:10,color:'var(--ink-4)'}}>{prompts.length} prompts</span>
      </div>
      <div className="scratch-wrap">
        <div className="scratch-hdr"><span className="scratch-t">Scratch Pad</span></div>
        <textarea className="scratch-area" placeholder="Quick notes…" value={scratch} onChange={e=>{setScratch(e.target.value);localStorage.setItem(K.notes,e.target.value);}}/>
      </div>
      {modal&&(
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-hdr"><span className="modal-title">{modal==='new'?'New Prompt':'Edit Prompt'}</span><button className="pr-btn" style={{opacity:1}} onClick={()=>setModal(null)}>✕</button></div>
            <div className="modal-body">
              <div className="field"><label>Title</label><input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} autoFocus/></div>
              <div className="field"><label>Category</label><input value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}/></div>
              <div className="field"><label>Content</label><textarea value={form.body} onChange={e=>setForm(f=>({...f,body:e.target.value}))}/></div>
            </div>
            <div className="modal-foot">
              <button className="s-btn" onClick={()=>setModal(null)}>Cancel</button>
              <button className="s-btn primary" onClick={saveP}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── APP ── */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [profiles, setProfiles] = useState(()=>{
    try{const r=localStorage.getItem(K.profiles);return r?JSON.parse(r):[defaultProfile()];}catch{return [defaultProfile()];}
  });
  const [activeId, setActiveId] = useState(()=>localStorage.getItem(K.activeProfile)||null);
  const profile = useMemo(()=>profiles.find(p=>p.id===activeId)||profiles[0], [profiles,activeId]);

  const [text,setText]=useState('');
  const [polished,setPolished]=useState(null);
  const [polishing,setPolishing]=useState(false);
  const [recording,setRecording]=useState(false);
  const [reading,setReading]=useState(false);
  const [interim,setInterim]=useState('');
  const [showDiff,setShowDiff]=useState(false);
  const [showVault,setShowVault]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [audioLevel,setAudioLevel]=useState(0);
  const [toast,setToast]=useState(null);

  const textareaRef=useRef();
  const recogRef=useRef();
  // Mirror tweaks into a ref so startMeter (called from recognition callbacks)
  // sees the live value without re-binding listeners on every change.
  const tweaksRef=useRef(tweaks);
  useEffect(()=>{tweaksRef.current=tweaks;},[tweaks]);
  const audioCtxRef=useRef();
  const analyserRef=useRef();
  const animRef=useRef();
  const autoPauseRef=useRef();
  const insertPosRef=useRef(0);
  const selectionRef=useRef({start:0,end:0});
  const undoStackRef=useRef([]);
  const saveToVaultRef=useRef(null);
  const profileRef=useRef(profile);
  const textRef=useRef(text);
  useEffect(()=>{profileRef.current=profile;},[profile]);
  useEffect(()=>{textRef.current=text;},[text]);

  const saveProfiles=useCallback((p)=>{localStorage.setItem(K.profiles,JSON.stringify(p));setProfiles(p);},[]);
  const updateProfile=(id,patch)=>{
    const next=profiles.map(p=>p.id===id?{...p,...patch}:p);
    saveProfiles(next);
  };
  const addProfile=p=>{const next=[...profiles,p];saveProfiles(next);setActiveId(p.id);localStorage.setItem(K.activeProfile,p.id);};
  const deleteProfile=id=>{
    const next=profiles.filter(p=>p.id!==id);
    if(!next.length)return;
    saveProfiles(next);
    if(activeId===id){setActiveId(next[0].id);localStorage.setItem(K.activeProfile,next[0].id);}
  };
  const setActive=id=>{setActiveId(id);localStorage.setItem(K.activeProfile,id);};

  const autoResize=el=>{if(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}};
  const trackCursor=()=>{if(textareaRef.current){insertPosRef.current=textareaRef.current.selectionStart;selectionRef.current={start:textareaRef.current.selectionStart,end:textareaRef.current.selectionEnd};}};

  const polish=useCallback(async(src)=>{
    if(!src.trim()||polishing)return;
    if(!window.claude){navigator.clipboard.writeText(src).then(()=>setToast('Copied to clipboard'));return;}
    setPolishing(true);
    try{
      const result=await window.claude.complete({messages:[{role:'user',content:`You are a grammar and clarity polishing assistant for a dyslexic writer. Correct grammar, punctuation, spelling and structure. Preserve the writer's voice and intent completely. Output only the polished text.\n\nPolish:\n\n${src.trim()}`}]});
      setPolished({text:result.trim(),original:src.trim()});setShowDiff(false);
    }catch{setToast('Something went wrong.');}
    setPolishing(false);
  },[polishing]);

  const readAloud=(src)=>{
    if(!('speechSynthesis' in window)){setToast('Text-to-speech not supported');return;}
    window.speechSynthesis.cancel();
    const utt=new SpeechSynthesisUtterance(src||(polished?.text||text));
    utt.lang='en-US'; utt.rate=0.95; utt.pitch=1;
    utt.onstart=()=>setReading(true);
    utt.onend=()=>setReading(false);
    utt.onerror=()=>setReading(false);
    window.speechSynthesis.speak(utt);
  };
  const stopReading=()=>{window.speechSynthesis.cancel();setReading(false);};

  const executeCommand=(action)=>{
    if(action==='stop'){recogRef.current?.stop();return;}
    if(action==='undo'){undoLast();return;}
    if(action==='read_aloud'){readAloud(textRef.current);return;}
    if(action==='clear'){if(confirm('Clear the document?')){setText('');setPolished(null);}return;}
    if(action==='copy'){navigator.clipboard.writeText(textRef.current).then(()=>setToast('Copied!'));return;}
    if(action==='save_vault'&&saveToVaultRef.current){const t=textRef.current.slice(0,50);saveToVaultRef.current(t,textRef.current,'Dictated');setToast('Saved to Vault');return;}
    if(action.startsWith('insert:')){const ins=action.slice(7);insertAt(ins);}
  };

  const insertAt=(insertText)=>{
    setText(prev=>{
      const{start,end}=selectionRef.current;
      const next=prev.slice(0,start)+insertText+prev.slice(end);
      const newPos=start+insertText.length;
      insertPosRef.current=newPos;selectionRef.current={start:newPos,end:newPos};
      setTimeout(()=>{if(textareaRef.current){textareaRef.current.selectionStart=newPos;textareaRef.current.selectionEnd=newPos;autoResize(textareaRef.current);}},0);
      return next;
    });
  };

  const undoLast=()=>{
    const prev=undoStackRef.current.pop();if(!prev)return;
    setText(prev.text);selectionRef.current={start:prev.selStart,end:prev.selEnd};
    setTimeout(()=>{if(textareaRef.current){textareaRef.current.selectionStart=prev.selEnd;textareaRef.current.selectionEnd=prev.selEnd;autoResize(textareaRef.current);}},0);
  };

  // Cache the mic stream + audio graph for the page lifetime so we only ever
  // prompt for permission once. Each record session just resumes the context
  // and starts a new RAF loop; stop tears down the loop but leaves the
  // MediaStream alive (browsers won't re-prompt while a track is still live).
  const startMeter=async()=>{
    if(!tweaksRef.current.audioMeter) return;
    try{
      if(!audioCtxRef.current){
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        const src=ctx.createMediaStreamSource(stream);
        const an=ctx.createAnalyser();an.fftSize=256;src.connect(an);
        audioCtxRef.current=ctx;analyserRef.current=an;
      }
      if(audioCtxRef.current.state==='suspended') await audioCtxRef.current.resume();
      const an=analyserRef.current;
      const buf=new Uint8Array(an.frequencyBinCount);
      const tick=()=>{an.getByteFrequencyData(buf);const avg=buf.reduce((a,b)=>a+b,0)/buf.length;setAudioLevel(Math.min(100,avg*2.8));animRef.current=requestAnimationFrame(tick);};tick();
    }catch{}
  };
  const stopMeter=()=>{if(animRef.current)cancelAnimationFrame(animRef.current);setAudioLevel(0);};

  const startRecord=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setToast('Speech recognition not supported');return;}
    startMeter();
    const r=new SR();r.continuous=true;r.interimResults=true;r.maxAlternatives=3;r.lang='en-US';
    r.onresult=e=>{
      let fin='',tmp='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal){let best=e.results[i][0];for(let k=1;k<e.results[i].length;k++){if(e.results[i][k].confidence>best.confidence)best=e.results[i][k];}fin+=best.transcript;}
        else tmp+=e.results[i][0].transcript;
      }
      if(fin){
        const prof=profileRef.current;
        // Check commands first
        const cmd=checkCommand(fin,prof);
        if(cmd){executeCommand(cmd);return;}
        const processed=processTranscript(fin,prof);
        if(!processed)return;
        const insertText=processed+' ';
        setText(prev=>{
          const{start,end}=selectionRef.current;
          undoStackRef.current.push({text:prev,selStart:start,selEnd:end});
          if(undoStackRef.current.length>20)undoStackRef.current.shift();
          const next=prev.slice(0,start)+insertText+prev.slice(end);
          const newPos=start+insertText.length;
          insertPosRef.current=newPos;selectionRef.current={start:newPos,end:newPos};
          setTimeout(()=>{if(textareaRef.current){textareaRef.current.selectionStart=newPos;textareaRef.current.selectionEnd=newPos;autoResize(textareaRef.current);}},0);
          if(prof.autoPolish){clearTimeout(autoPauseRef.current);autoPauseRef.current=setTimeout(()=>polish(next),(prof.autoPauseSec||2.2)*1000);}
          return next;
        });
      }
      setInterim(tmp);
    };
    r.onerror=e=>{if(e.error!=='aborted')setToast('Mic: '+e.error);};
    r.onend=()=>{setRecording(false);setInterim('');stopMeter();clearTimeout(autoPauseRef.current);};
    r.start();recogRef.current=r;setRecording(true);setPolished(null);
  };
  const stopRecord=()=>{recogRef.current?.stop();setRecording(false);setInterim('');stopMeter();clearTimeout(autoPauseRef.current);};

  const handleAccept=()=>{setText(polished.text);setPolished(null);setTimeout(()=>{if(textareaRef.current)autoResize(textareaRef.current);},0);};
  const handleCopy=()=>navigator.clipboard.writeText(polished?.text||text).then(()=>setToast('Copied!'));
  const handleSaveVault=()=>{if(!polished?.text||!saveToVaultRef.current)return;saveToVaultRef.current(polished.text.slice(0,50),polished.text,'Polished');setToast('Saved to Vault');};

  const loadFromVault=(t)=>{
    const insertText=t+'\n\n';
    setText(prev=>{const{start,end}=selectionRef.current;const next=prev.slice(0,start)+insertText+prev.slice(end);const newPos=start+insertText.length;insertPosRef.current=newPos;selectionRef.current={start:newPos,end:newPos};setTimeout(()=>{if(textareaRef.current){textareaRef.current.selectionStart=newPos;textareaRef.current.selectionEnd=newPos;autoResize(textareaRef.current);textareaRef.current.focus();}},50);return next;});
    setPolished(null);navigator.clipboard.writeText(t).catch(()=>{});
  };

  const meterBars=Array.from({length:10},(_,i)=>{const th=(i+1)*10;const h=audioLevel>=th?Math.min(18,5+(i*1.5)):2;return <div key={i} className="mbar" style={{height:h,background:audioLevel>70?'var(--rose)':audioLevel>40?'var(--amber)':'var(--sage)'}}/>;});

  const micState=reading?'reading':recording?'on':'idle';

  return (
    <div className="shell">
      <ThemeStyles t={tweaks}/>
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      {polishing&&<div className="pbar"/>}

      <header className="hdr">
        <div className="logo">WordSmith<span className="logo-dot">.</span></div>
        <div className="hdiv"/>
        <select className="select" style={{maxWidth:140,fontSize:12,border:'1.5px solid var(--border-s)',borderRadius:20,padding:'4px 10px',background:'var(--surface)',fontFamily:'var(--sans)',color:'var(--ink-2)'}} value={profile?.id||''} onChange={e=>setActive(e.target.value)}>
          {profiles.map(p=><option key={p.id} value={p.id}>{p.icon} {p.name}</option>)}
        </select>
        <div className="hright">
          <button className={`hpill${showVault?' on':''}`} onClick={()=>setShowVault(v=>!v)}>⬡ Vault</button>
          <button className={`hpill${showSettings?' on':''}`} onClick={()=>setShowSettings(v=>!v)}>⚙ Settings</button>
        </div>
      </header>

      {/* TOOLBAR */}
      <div className="toolbar">
        {/* Auto-polish */}
        <button className={`tbar-btn${profile.autoPolish?' active sage':''}`} onClick={()=>updateProfile(profile.id,{autoPolish:!profile.autoPolish})}>
          <span style={{width:7,height:7,borderRadius:'50%',background:profile.autoPolish?'var(--sage)':'var(--ink-4)',display:'inline-block',flexShrink:0}}/>
          Auto-polish {profile.autoPolish?'on':'off'}
        </button>
        {/* Manual polish */}
        {!profile.autoPolish&&text.trim()&&(
          <button className="tbar-btn active" onClick={()=>polish(text)} disabled={polishing}>
            {polishing?<><span className="spinner" style={{borderColor:'rgba(74,124,89,.3)',borderTopColor:'var(--sage)'}}/> Polishing…</>:<>✦ Polish now</>}
          </button>
        )}
        <div className="tbar-sep"/>
        {/* Undo */}
        {recording&&<button className="tbar-btn" onClick={undoLast}>↩ Undo phrase</button>}
        {/* Copy */}
        <button className="tbar-btn" onClick={handleCopy}>📋 Copy all</button>
        {/* Read aloud */}
        {reading
          ? <button className="tbar-btn rose" onClick={stopReading}>⏹ Stop reading</button>
          : <button className="tbar-btn" onClick={()=>readAloud(text)}>🔊 Read aloud</button>
        }
        <div className="tbar-sep"/>
        {/* Word count */}
        <span style={{fontSize:11,color:'var(--ink-3)',fontFamily:'var(--mono)',marginLeft:2}}>
          {text.trim()?`${text.trim().split(/\s+/).filter(Boolean).length} words`:''}
        </span>
      </div>

      <div className="main">
        <div className="write-panel">
          <div className="doc-wrap">
            <div className="doc-page">
              <textarea
                ref={textareaRef}
                className="doc-ta"
                placeholder={"Start speaking, or type here…\n\nClick to position your cursor, then tap the mic button to speak from that point.\n\nDouble-click a word to select it, then speak to replace it."}
                value={text}
                onChange={e=>{setText(e.target.value);autoResize(e.target);trackCursor();setPolished(null);}}
                onKeyDown={trackCursor}
                onKeyUp={trackCursor}
                onMouseUp={trackCursor}
                onMouseDown={trackCursor}
                onSelect={trackCursor}
                onDoubleClick={trackCursor}
                onFocus={trackCursor}
              />

              {polished&&(
                <div className="pol-wrap">
                  <div className="pol-label">
                    <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 7.5l3 3 7-7" stroke="#4a7c59" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    Polished
                    <button style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'var(--sage)',fontFamily:'var(--sans)',padding:'0 4px',marginLeft:4}} onClick={()=>setShowDiff(v=>!v)}>{showDiff?'Hide changes':'Show changes'}</button>
                  </div>
                  {showDiff&&<DiffView original={polished.original} polished={polished.text}/>}
                  <div className="pol-text">{polished.text}</div>
                  <div className="pol-actions">
                    <button className="pbtn pbtn-primary" onClick={handleAccept}>✓ Accept &amp; replace</button>
                    <button className="pbtn pbtn-outline" onClick={handleCopy}>📋 Copy</button>
                    <button className="pbtn pbtn-outline" onClick={()=>readAloud(polished.text)}>🔊 Read back</button>
                    <button className="pbtn pbtn-amber" onClick={handleSaveVault}>⬡ Save to Vault</button>
                    <button className="pbtn pbtn-ghost" onClick={()=>setPolished(null)}>Discard</button>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Floating mic */}
          <div className="mic-zone">
            {recording&&interim&&<div className="interim-chip">{interim}</div>}
            {recording&&tweaks.audioMeter&&<div className="audio-meter">{meterBars}</div>}
            <button
              className={`mic-btn ${micState}`}
              onClick={recording?stopRecord:reading?stopReading:startRecord}
              title={recording?'Stop recording':reading?'Stop reading':'Start voice transcription'}
            >
              {recording?'⏹':reading?'🔊':'🎙'}
            </button>
            <div className="mic-status">
              {recording?'Recording — tap to stop':reading?'Reading aloud — tap to stop':polishing?'Polishing…':'Tap mic to speak'}
            </div>
          </div>
        </div>

        {showVault&&<VaultSidebar onLoad={loadFromVault} onSaveRef={saveToVaultRef}/>}
      </div>

      {showSettings&&(
        <SettingsDrawer
          profiles={profiles}
          activeId={profile.id}
          onClose={()=>setShowSettings(false)}
          onUpdateProfile={updateProfile}
          onAddProfile={addProfile}
          onDeleteProfile={deleteProfile}
          onSetActive={setActive}
        />
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Atmosphere">
          <TweakColor
            label="Palette"
            value={ATMOSPHERES[tweaks.atmosphere].vars.bg}
            options={Object.entries(ATMOSPHERES).map(([k,a])=>a.vars.bg)}
            onChange={(bg)=>{
              const found=Object.entries(ATMOSPHERES).find(([,a])=>a.vars.bg===bg);
              if(found) setTweak('atmosphere', found[0]);
            }}
          />
        </TweakSection>
        <TweakSection label="Voice">
          <TweakRadio
            label="Type system"
            value={tweaks.voice}
            options={Object.entries(VOICES).map(([k,v])=>({value:k,label:v.label}))}
            onChange={(v)=>setTweak('voice',v)}
          />
        </TweakSection>
        <TweakSection label="Form">
          <TweakRadio
            label="Composition"
            value={tweaks.form}
            options={Object.entries(FORMS).map(([k,f])=>({value:k,label:f.label}))}
            onChange={(v)=>setTweak('form',v)}
          />
        </TweakSection>
        <TweakSection label="Microphone">
          <TweakToggle
            label="Audio level meter"
            value={tweaks.audioMeter}
            onChange={(v)=>setTweak('audioMeter',v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
